[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goo"
version = "0.2.0.dev0"
description = "A paint world of arbitrary substances under three ledgers: matter, energy and light. goo.classic is the first engine, deprecated."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.60", "scikit-image>=0.21", "matplotlib>=3.7", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["goo*"]

[tool.setuptools.package-data]
"goo.classic.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
